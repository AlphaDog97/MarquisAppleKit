name: BodyMap iOS Typecheck

on:
  pull_request:
    paths:
      - "Sources/AppDesignComponents/BodyMap/**"
      - "Sources/AppDesignComponents/Resources/BodyMap/**"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Add SwiftPM bundle shim
        run: |
          cat > /tmp/BodyMapBundleModule.swift <<'EOF'
          import Foundation
          extension Bundle {
              static var module: Bundle { .main }
          }
          EOF

      - name: Typecheck BodyMap for iOS Simulator
        run: |
          xcrun --sdk iphonesimulator swiftc \
            -target arm64-apple-ios17.0-simulator \
            -parse-as-library \
            -typecheck \
            -module-name AppDesignComponents \
            $(find Sources/AppDesignComponents/BodyMap -name '*.swift' -print) \
            /tmp/BodyMapBundleModule.swift
