name: Import BodyMap Assets

on:
  push:
    branches:
      - fix/somatrack-body-map-parity
    paths:
      - .github/workflows/import-bodymap-assets.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: macos-15

    steps:
      - name: Check out MarquisAppleKit
        uses: actions/checkout@v6
        with:
          ref: fix/somatrack-body-map-parity
          fetch-depth: 0

      - name: Check out SomaTrack source assets
        uses: actions/checkout@v6
        with:
          repository: AlphaDog97/SomaTrack
          ref: main
          path: _SomaTrack

      - name: Copy BodyMap asset catalog
        run: |
          set -euo pipefail
          destination="Sources/AppDesignComponents/Resources/BodyMapAssets.xcassets"
          rm -rf "$destination"
          mkdir -p "$destination"
          cp -R _SomaTrack/SomaTrack/Assets.xcassets/FitnessBodyParts.contents/. "$destination/"
          echo "Imported $(find "$destination" -name '*.pdf' | wc -l | tr -d ' ') PDF assets"
          test "$(find "$destination" -name '*.pdf' | wc -l | tr -d ' ')" = "38"

      - name: Validate asset catalog
        run: |
          set -euo pipefail
          mkdir -p /tmp/bodymap-asset-build
          xcrun actool \
            Sources/AppDesignComponents/Resources/BodyMapAssets.xcassets \
            --compile /tmp/bodymap-asset-build \
            --platform iphonesimulator \
            --minimum-deployment-target 17.0 \
            --target-device iphone \
            --target-device ipad

      - name: Commit imported assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Sources/AppDesignComponents/Resources/BodyMapAssets.xcassets
          if git diff --cached --quiet; then
            echo "BodyMap assets already match SomaTrack"
            exit 0
          fi
          git commit -m "Bundle BodyMap anatomy PDF assets"
          git push origin HEAD:fix/somatrack-body-map-parity
