name: Verify Share Sheet 0.2.3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select newest Xcode
        run: |
          BEST_APP=""
          BEST_MAJOR=0
          for APP in /Applications/Xcode*.app; do
            VERSION="$($APP/Contents/Developer/usr/bin/xcodebuild -version | head -1 | awk '{print $2}')"
            MAJOR="${VERSION%%.*}"
            if [[ "$MAJOR" =~ ^[0-9]+$ ]] && (( MAJOR > BEST_MAJOR )); then
              BEST_MAJOR="$MAJOR"
              BEST_APP="$APP"
            fi
          done
          test -n "$BEST_APP"
          sudo xcode-select --switch "$BEST_APP/Contents/Developer"
          xcodebuild -version

      - name: Build AppDesignComponents for iOS Simulator
        run: |
          xcodebuild \
            -scheme AppDesignComponents \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
