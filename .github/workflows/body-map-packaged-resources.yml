name: Validate BodyMap Packaged Resources

on:
  push:
    branches:
      - fix/somatrack-body-map-parity
    paths:
      - .github/workflows/body-map-packaged-resources.yml
      - Sources/AppDesignComponents/BodyMap/**
      - Sources/AppDesignComponents/Resources/BodyMap/**
      - Tests/AppDesignComponentsTests/BodyMapTests.swift
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/body-map-packaged-resources.yml
      - Sources/AppDesignComponents/BodyMap/**
      - Sources/AppDesignComponents/Resources/BodyMap/**
      - Tests/AppDesignComponentsTests/BodyMapTests.swift

jobs:
  validate-body-map:
    runs-on: macos-15

    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Validate packaged PDFs
        run: |
          set -euo pipefail
          cat > /tmp/validate_bodymap_pdfs.swift <<'SWIFT'
          import CoreGraphics
          import Foundation

          let root = URL(fileURLWithPath: FileManager.default.currentDirectoryPath)
              .appendingPathComponent("Sources/AppDesignComponents/Resources/BodyMap/HumanBody")
          let files = try FileManager.default.contentsOfDirectory(
              at: root,
              includingPropertiesForKeys: nil
          ).filter { $0.pathExtension.lowercased() == "pdf" }

          guard files.count == 38 else {
              fatalError("Expected 38 BodyMap PDFs, found \(files.count)")
          }

          for url in files.sorted(by: { $0.lastPathComponent < $1.lastPathComponent }) {
              guard let document = CGPDFDocument(url as CFURL),
                    let page = document.page(at: 1) else {
                  fatalError("Unreadable BodyMap PDF: \(url.lastPathComponent)")
              }
              let box = page.getBoxRect(.mediaBox)
              guard box.width > 0, box.height > 0 else {
                  fatalError("Invalid media box: \(url.lastPathComponent)")
              }
          }

          print("Validated \(files.count) BodyMap PDFs")
          SWIFT
          xcrun swift /tmp/validate_bodymap_pdfs.swift

      - name: Typecheck BodyMap for iOS 17 Simulator
        run: |
          set -euo pipefail
          cat > /tmp/BodyMapBundleModule.swift <<'SWIFT'
          import Foundation
          extension Bundle { static var module: Bundle { .main } }
          SWIFT
          xcrun --sdk iphonesimulator swiftc \
            -target arm64-apple-ios17.0-simulator \
            -parse-as-library \
            -typecheck \
            -module-name AppDesignComponents \
            $(find Sources/AppDesignComponents/BodyMap -name '*.swift' -print) \
            /tmp/BodyMapBundleModule.swift

      - name: Typecheck BodyMap for macOS 14
        run: |
          set -euo pipefail
          cat > /tmp/BodyMapBundleModule.swift <<'SWIFT'
          import Foundation
          extension Bundle { static var module: Bundle { .main } }
          SWIFT
          xcrun --sdk macosx swiftc \
            -target arm64-apple-macos14.0 \
            -parse-as-library \
            -typecheck \
            -module-name AppDesignComponents \
            $(find Sources/AppDesignComponents/BodyMap -name '*.swift' -print) \
            /tmp/BodyMapBundleModule.swift
