name: Release v0.1.0

on:
  pull_request:
    types:
      - opened

permissions:
  contents: write
  statuses: write

jobs:
  release:
    if: >-
      github.event.pull_request.title == 'Release 0.1.0' &&
      github.event.pull_request.head.ref == 'release-trigger/v0.1.0'
    runs-on: macos-15

    env:
      RELEASE_SHA: 36c543dfb37cf04ac92a36ab7a358f23f9390fba
      VERSION: 0.1.0
      TAG: v0.1.0

    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Mark release pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$RELEASE_SHA" \
            -f state=pending \
            -f context="release/$TAG" \
            -f description="Testing before publishing $TAG" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions"

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail

          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "No release notes found for $VERSION in CHANGELOG.md" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi

          gh release create "$TAG" \
            --target "$RELEASE_SHA" \
            --title "MarquisAppleKit $VERSION" \
            --notes-file release-notes.md \
            --latest

      - name: Mark release successful
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$RELEASE_SHA" \
            -f state=success \
            -f context="release/$TAG" \
            -f description="Published $TAG" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: Mark release failed
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$RELEASE_SHA" \
            -f state=failure \
            -f context="release/$TAG" \
            -f description="Failed to publish $TAG" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions"
