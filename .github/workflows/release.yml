name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release ')
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Parse version
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          first_line="${COMMIT_MESSAGE%%$'\n'*}"
          version="${first_line#Release }"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release commit message: $first_line" >&2
            exit 1
          fi

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Mark release pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context="release/$TAG" \
            -f description="Testing before publishing $TAG" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions"

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail

          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "No release notes found for $VERSION in CHANGELOG.md" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists" >&2
            exit 1
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "MarquisAppleKit $VERSION" \
            --notes-file release-notes.md \
            --latest

      - name: Mark release successful
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success \
            -f context="release/$TAG" \
            -f description="Published $TAG" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: Mark release failed
        if: ${{ failure() && env.TAG != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=failure \
            -f context="release/$TAG" \
            -f description="Failed to publish $TAG" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions"
